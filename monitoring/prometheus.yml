global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: kdbl-bot
    static_configs:
      - targets: ["bot:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
